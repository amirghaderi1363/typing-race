<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⌨️ Typing Race</h1>
            <p class="subtitle">Test your typing speed!</p>
        </header>
        
        <div id="menu" class="screen active">
            <div class="card">
                <h2>Ready to Race?</h2>
                <p>Test your typing speed and beat your record!</p>
            </div>
            
            <div class="stats-card">
                <h3>🏆 Your Best Records</h3>
                <div id="bestRecords">
                    <p>No records yet. Play to set your first record!</p>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button id="startBtn" class="btn btn-primary">🚀 Start Game</button>
            </div>
        </div>
        
        <div id="game" class="screen">
            <div class="game-header">
                <div class="timer">⏱️ <span id="timer">0.0</span>s</div>
                <div class="wpm-display">📝 <span id="currentWPM">0</span> WPM</div>
                <div class="accuracy-display">🎯 <span id="currentAccuracy">100</span>%</div>
            </div>
            
            <div class="text-display" id="textDisplay"></div>
            
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
                <span id="progressText">0%</span>
            </div>
            
            <div class="input-area">
                <textarea id="userInput" placeholder="Start typing here..." autofocus></textarea>
            </div>
            
            <div class="game-controls">
                <button id="restartBtn" class="btn btn-primary">🔄 Restart</button>
                <button id="backBtn" class="btn btn-secondary">🏠 Menu</button>
            </div>
        </div>
        
        <div id="result" class="screen">
            <div class="result-card">
                <h2>🎉 Race Complete!</h2>
                
                <div class="result-stats">
                    <div class="stat big-stat">
                        <span class="stat-value" id="finalWPM">0</span>
                        <span class="stat-label">WPM</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="finalAccuracy">0%</span>
                        <span class="stat-label">Accuracy</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="finalTime">0s</span>
                        <span class="stat-label">Time</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="finalChars">0</span>
                        <span class="stat-label">Characters</span>
                    </div>
                </div>
                
                <div class="result-message" id="resultMessage"></div>
                
                <div class="result-buttons">
                    <button id="retryBtn" class="btn btn-primary">🔄 Play Again</button>
                    <button id="menuBtn" class="btn btn-secondary">🏠 Menu</button>
                </div>
            </div>
            
            <div class="leaderboard">
                <h3>🏆 Leaderboard</h3>
                <div id="leaderboard"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
